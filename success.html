
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payment Result</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: grid;
      place-items: center; padding: 20px;
      background: #f3f5fb; font-family: Arial, sans-serif;
    }
    main {
      max-width: 460px; width: 100%; padding: 35px;
      box-sizing: border-box; text-align: center;
      background: white; border-radius: 20px;
      box-shadow: 0 12px 40px #18264a12;
    }
    #icon { font-size: 55px; }
    h1 { color: #16794b; }
    p { color: #657087; line-height: 1.7; }
    a {
      display: inline-block; margin-top: 18px; padding: 13px 22px;
      background: #4f46e5; color: white;
      text-decoration: none; border-radius: 9px;
    }
  </style>
</head>
<body>
  <main>
    <div id="icon">⏳</div>
    <h1 id="title">Verifying payment...</h1>
    <p id="message">Checking payment status with Stripe.</p>
    <a href="/" id="home" hidden>Back to Store</a>
  </main>

  <script>
    async function verifyPayment() {
      const params = new URLSearchParams(location.search);
      const sessionId = params.get("session_id");
      const title = document.getElementById("title");
      const message = document.getElementById("message");
      const icon = document.getElementById("icon");
      const home = document.getElementById("home");

      if (!sessionId) {
        title.textContent = "Session Missing";
        message.textContent = "No Checkout Session was provided.";
        icon.textContent = "⚠️";
        home.hidden = false;
        return;
      }

      try {
        const response = await fetch(
          "/api/checkout-session?session_id=" +
          encodeURIComponent(sessionId)
        );

        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error(data.message || "Payment not confirmed.");
        }

        icon.textContent = "✅";
        title.textContent = "Payment Successful!";
        message.textContent =
          `${data.product} — ${data.currency} ${data.amount.toFixed(2)}. ` +
          data.message;
      } catch (error) {
        icon.textContent = "⚠️";
        title.textContent = "Payment Not Confirmed";
        message.textContent = error.message;
      }

      home.hidden = false;
    }

    verifyPayment();
  </script>
</body>
</html>
