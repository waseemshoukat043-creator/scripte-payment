
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout Cancelled</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: grid;
      place-items: center; padding: 20px;
      background: #f3f5fb; font-family: Arial, sans-serif;
    }
    main {
      max-width: 440px; width: 100%; padding: 35px;
      box-sizing: border-box; background: white;
      text-align: center; border-radius: 20px;
      box-shadow: 0 12px 40px #18264a12;
    }
    .icon { font-size: 55px; }
    h1 { color: #26324b; }
    p { color: #657087; line-height: 1.7; }
    a {
      display: inline-block; margin-top: 18px; padding: 13px 22px;
      background: #4f46e5; color: white;
      text-decoration: none; border-radius: 9px;
    }
  </style>
</head>
<body>
  <main>
    <div class="icon">↩️</div>
    <h1>Checkout Cancelled</h1>
    <p>
      Checkout was cancelled. No successful test payment was completed.
    </p>
    <a href="/">Return to Store</a>
  </main>
</body>
</html>
