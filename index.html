
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Day 24 | Stripe Checkout</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 20px; background: #f3f5fb; color: #172033;
      font-family: Arial, sans-serif;
    }
    main {
      width: 100%; max-width: 460px; padding: 32px;
      background: white; border-radius: 20px;
      box-shadow: 0 12px 40px #18264a12;
    }
    .icon {
      width: 56px; height: 56px; display: grid;
      place-items: center; border-radius: 15px;
      background: #e9edff; font-size: 27px;
    }
    .tag { color: #4f46e5; font-size: 12px; font-weight: bold; }
    h1 { font-size: 28px; }
    .muted { color: #68738a; line-height: 1.6; }
    .product {
      margin: 24px 0; padding: 20px;
      border: 1px solid #e4e8f0; border-radius: 14px;
    }
    .price { font-size: 30px; font-weight: bold; }
    button {
      width: 100%; padding: 15px; border: 0;
      border-radius: 10px; background: #4f46e5;
      color: white; font-size: 16px; font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #message { color: #b42318; }
    footer { margin-top: 20px; text-align: center; font-size: 12px; color: #68738a; }
  </style>
</head>
<body>
  <main>
    <div class="icon">💳</div>
    <p class="tag">DAY 24 · STRIPE PAYMENTS</p>
    <h1>Secure Checkout</h1>
    <p class="muted">
      Purchase your course through Stripe's hosted checkout.
    </p>

    <section class="product">
      <div style="font-size:25px">🎓</div>
      <h2>Web Development Course</h2>
      <p class="muted">One-time payment · Demo product</p>
      <p class="price">$19.99 USD</p>
    </section>

    <button id="payButton">Pay Securely →</button>
    <p id="message" role="alert"></p>
    <footer>🔒 Stripe Test Mode · No real charge</footer>
  </main>

  <script>
    const button = document.getElementById("payButton");
    const message = document.getElementById("message");

    button.addEventListener("click", async () => {
      button.disabled = true;
      button.textContent = "Connecting to Stripe...";
      message.textContent = "";

      try {
        const response = await fetch("/api/create-checkout-session", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({})
        });

        const data = await response.json();

        if (!response.ok || !data.success || !data.url) {
          throw new Error(data.message || "Checkout failed.");
        }

        window.location.assign(data.url);
      } catch (error) {
        message.textContent = error.message;
        button.disabled = false;
        button.textContent = "Try Again";
      }
    });
  </script>
</body>
</html>
